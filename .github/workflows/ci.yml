name: CI

# PRs: lint, test, render the chart, and build the image for both arches (no push).
# main and v* tags: the same, then push to GHCR:
#   image ghcr.io/barakplasma/rhapsode: sha-<7> (what homelab-manifests pins), latest (main), semver (tags)
#   chart oci://ghcr.io/barakplasma/charts/rhapsode: <Chart.yaml version>-sha-<7> (main), <tag> (tags),
#         with appVersion = the image tag pushed by the same run

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e '.[test]' ruff
      - run: ruff check src tests
      - run: pytest -q tests

  chart:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install kubeconform
        run: |
          curl -fsSL -o kubeconform.tgz https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz
          echo "95f14e87aa28c09d5941f11bd024c1d02fdc0303ccaa23f61cef67bc92619d73  kubeconform.tgz" | sha256sum -c -
          sudo tar xzf kubeconform.tgz -C /usr/local/bin kubeconform
      - run: helm lint --strict charts/rhapsode
      # defaults (trusted-ca mounted), CA off, and every other option on
      - run: |
          helm template t charts/rhapsode -n homer | kubeconform -strict -summary -
          helm template t charts/rhapsode -n homer --set trustedCAConfigMap= | kubeconform -strict -summary -
          helm template t charts/rhapsode -n rhapsode --set homerNamespace=homer \
            --set trustedCAConfigMap=my-ca --set-json 'approvedHosts=["a.example.com","b.example.com"]' \
            --set-json 'extraEnv=[{"name":"X","valueFrom":{"secretKeyRef":{"name":"s","key":"k"}}}]' \
            | kubeconform -strict -summary -
      - name: values.schema.json rejects bad values
        run: |
          for bad in "image.pullPolicy=Sometimes" "trustedCAConfigMap=Bad_Name" "typo=1" "homerNamespace=Bad_NS" \
                     "approvedHosts[0]=bad host" "approvedHosts[0]=*.example.com"; do
            if helm template t charts/rhapsode --set "$bad" >/dev/null 2>&1; then
              echo "::error::schema accepted --set $bad"; exit 1
            fi
          done

  image:
    needs: [test, chart]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    env:
      PUSH: ${{ github.event_name != 'pull_request' }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      # the cluster node is arm64
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: env.PUSH == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ env.PUSH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

  publish-chart:
    needs: image  # the chart's appVersion must name an image that exists
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Package and push
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_ACTOR: ${{ github.actor }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$REF_TYPE" = tag ]; then
            version="${REF_NAME#v}"; app="$version"
          else
            base=$(sed -n 's/^version: *//p' charts/rhapsode/Chart.yaml)
            app="sha-${GITHUB_SHA:0:7}"; version="${base}-${app}"
          fi
          echo "$GH_TOKEN" | helm registry login ghcr.io -u "$GH_ACTOR" --password-stdin
          helm package charts/rhapsode --version "$version" --app-version "$app"
          helm push "rhapsode-${version}.tgz" "oci://ghcr.io/${GITHUB_REPOSITORY_OWNER}/charts"
