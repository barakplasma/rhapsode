[project]
name = "rhapsode"
version = "0.1.0"
description = "Controller that fills Homer's dashboard with public k8s Ingresses/HTTPRoutes, described by an LLM agent"
requires-python = ">=3.11"
dependencies = [
  "claude-agent-sdk>=0.1.0",
  "kubernetes>=29.0.0",
  "httpx>=0.27",
  "PyYAML>=6.0",
]

[project.scripts]
rhapsode = "rhapsode.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rhapsode"]
