apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-base
  labels: {{- include "rhapsode.labels" . | nindent 4 }}
data:
  base.yml: |
    {{- .Values.baseConfig | nindent 4 }}
{{- if and .Values.trustedCA.configMap .Values.trustedCA.create }}
---
# Filled by OpenShift's cluster network operator; never by Helm.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.trustedCA.configMap }}
  labels:
    {{- include "rhapsode.labels" . | nindent 4 }}
    config.openshift.io/inject-trusted-cabundle: "true"
{{- end }}
