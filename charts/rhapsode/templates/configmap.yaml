apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-base
  labels: {{- include "rhapsode.labels" . | nindent 4 }}
data:
  base.yml: |
    {{- .Values.baseConfig | nindent 4 }}
{{- if and .Values.trustedCA.enabled (not .Values.trustedCA.existingConfigMap) }}
---
# OpenShift's cluster network operator fills data; the chart never sets it, so upgrades keep it.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "rhapsode.caConfigMap" . }}
  labels:
    {{- include "rhapsode.labels" . | nindent 4 }}
    config.openshift.io/inject-trusted-cabundle: "true"
{{- end }}
